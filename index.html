    <script>
      // 1) Restore the real path after the 404.html fallback redirect (see public/404.html).
      // 2) Redirect legacy hash URLs (/#/musicians) to clean paths (/musicians) so old
      //    links and bookmarks keep working after the switch to BrowserRouter.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
        if (window.location.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, null, window.location.hash.slice(1) || '/')
        }
      })(window.location)
    </script>
