<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New York Chamber Collective</title>
    <!--
      GitHub Pages serves this file for any path it does not recognise. Because the
      site is a single-page app, we encode the requested path into a query string and
      hand it back to index.html, which restores the real URL before React mounts.
      See https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/?/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
